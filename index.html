<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100d1c" />
    <meta name="description" content="Sigue la pelota, encuentra el vaso correcto y desbloquea un descuento especial." />
    <title>Halloween Game — Find the Treat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-brand="nexustours">
    <div class="ambient" aria-hidden="true"></div>
    <div class="site-shell">
      <header class="topbar">
        <a class="brand-lockup" href="index.html?lang=es" aria-label="NexusTours Halloween">
          <span class="brand-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 15.5 12 4l7 11.5-7 4.5-7-4.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.5 14.5 3.5-5 3.5 5-3.5 2.2-3.5-2.2Z" fill="currentColor" opacity=".75"/></svg>
          </span>
          <span class="campaign-name">HALLOWEEN GAME</span>
        </a>
        <div class="top-controls">
          <span class="brand-tag" aria-label="NexusTours brand">
            <span class="brand-tag-dot" aria-hidden="true"></span>
            <span id="brand-tag-name">NexusTours</span>
          </span>
          <button class="language-button" id="language-button" type="button" aria-label="Switch language">EN</button>
        </div>
      </header>
      <main>
        <section class="stage-card" aria-live="polite" aria-atomic="false">
          <div id="screen"></div>
        </section>
      </main>
      <footer class="site-footer">
        <span id="footer-left">A little Halloween magic, just for you.</span>
        <span id="footer-right">Play fair. Have fun. Travel happy.</span>
      </footer>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
